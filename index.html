<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Amazon Summit</title>
    <style>
        /* Estilos básicos para evitar margens indesejadas no mobile */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #f4f4f4; /* Cor de fundo opcional */
        }

        .container-banner {
            position: relative;
            width: 100%;
            max-width: 500px; /* Limita o tamanho em telas grandes */
            height: auto;
        }

        .container-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-reserva {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            /* Ajuste a largura e altura aqui se precisar de uma área de clique maior */
            width: 70%; 
            height: 10%;  
            background-color: rgba(255, 255, 255, 0); /* Mantenha 0 para invisível */
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent; /* Remove o flash azul ao tocar no celular */
        }

        /* Posicionamento proporcional baseado na altura da imagem */
        .reserva-13 {
            top: 34%; 
        }

        .reserva-14 {
            top: 56%;
        }

        /* Efeito de toque para mobile e hover para desktop */
        .btn-reserva:active, .btn-reserva:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
        }
    </style>
</head>
<body>

<div class="container-banner">
    <img src="https://github.com/user-attachments/assets/f7f25220-066b-4be8-b257-9fc471110d0c" alt="Evento Belém Pará 2026">

    <a href="https://luma.com/otg29sy7" class="btn-reserva reserva-13" aria-label="Reservar 13 de Maio"></a>
    <a href="https://luma.com/113wla1g" class="btn-reserva reserva-14" aria-label="Reservar 14 de Maio"></a>
</div>

</body>
</html>
